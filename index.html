<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLIPNOVA AI Server</title>
<style>:root{--bg:#070a1c;--card:#0f1430;--line:#232a5a;--m:#8b93c7}*{box-sizing:border-box}body{margin:0 auto;max-width:760px;padding:16px;background:radial-gradient(900px 500px at 50% -10%,#1a1450,var(--bg));color:#e8ecff;font:15px/1.45 system-ui,sans-serif}
h1{margin:4px 0;letter-spacing:2px;background:linear-gradient(90deg,#b026ff,#3b82f6);-webkit-background-clip:text;color:transparent}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
button,select,input[type=password],a.b{font:inherit;color:#fff;border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(90deg,#b026ff,#3b82f6);text-decoration:none;display:inline-block}button:disabled{opacity:.4}select,input[type=password]{background:#151b44;border:1px solid var(--line);width:100%}
progress{width:100%;accent-color:#b026ff}.note{color:var(--m);font-size:13px}.err{color:#ff6b8b}.hl{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}.hl img{width:112px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}video{width:100%;border-radius:12px;background:#000}</style></head><body>
<h1>CLIPNOVA AI</h1><p class="note">Server mode: big videos, FFmpeg + Whisper on the server.</p>
<div class="card"><input id="tok" type="password" placeholder="Access token (only if the server needs one)"><p><input id="file" type="file" accept="video/*"></p>
<button id="an" disabled>ANALYZE VIDEO</button><p><progress id="p1" value="0" max="100" hidden></progress></p><div id="t1" class="note"></div><div id="err" class="err"></div></div>
<div class="card"><div id="hls" class="note">Highlights appear here.</div></div>
<div class="card"><div class="row"><select id="dur"><option value="auto">Auto length</option><option>10</option><option>20</option><option>30</option><option>40</option></select>
<select id="lang"><option value="hindi">Hindi → Roman</option><option value="english">English</option></select><select id="res"><option value="720">720×1280</option><option value="1080">1080×1920</option></select></div>
<p><label><input type="checkbox" id="enh"> Denoise + light sharpen (ordinary filter, not AI super-resolution)</label></p><button id="gen" disabled>GENERATE CLIPS</button><p><progress id="p2" value="0" max="100" hidden></progress></p><div id="t2" class="note"></div></div>
<div class="card"><div id="clips" class="clips"></div><p><button id="all" disabled>Download all</button></p></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));let id,hl=[],F=null,busy=false;
const lock=b=>{busy=b;$('#an').disabled=b||!F;$('#gen').disabled=b||!hl.length;$('#file').disabled=b};
async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{'X-Token':$('#tok').value}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j}
const furl=n=>`/api/file/${id}/${n}?token=${encodeURIComponent($('#tok').value)}`;
async function poll(j,k){for(;;){const s=await api('/job/'+j);$('#p'+k).hidden=false;$('#p'+k).value=s.progress;$('#t'+k).textContent=s.msg;if(s.status==='done')return s.result;if(s.status==='error')throw new Error(s.msg);await sleep(1500)}}
$('#file').onchange=e=>{F=e.target.files[0]||null;hl=[];$('#an').disabled=!F;$('#err').textContent=''};
$('#an').onclick=async()=>{lock(true);$('#err').textContent='';try{
  const CH=8*2**20,n=Math.ceil(F.size/CH);id=(await api('/upload',{method:'POST'})).id;$('#p1').hidden=false;
  for(let i=0;i<n;i++){for(let t=0;;t++){try{await api(`/upload/${id}/${i}`,{method:'PUT',body:F.slice(i*CH,(i+1)*CH)});break}catch(x){if(t>2)throw x;await sleep(1500)}}$('#p1').value=100*(i+1)/n;$('#t1').textContent=`Uploading ${i+1}/${n} chunks`}
  await api(`/upload/${id}/finish?n=${n}`,{method:'POST'});
  hl=await poll((await api('/analyze/'+id,{method:'POST'})).job,1);hl.forEach(h=>h.on=true);draw();
}catch(x){$('#err').textContent=x.message}lock(false)};
const rng=h=>{const s=$('#dur').value,d=s==='auto'?h.auto:+s;return{d,s:Math.min(Math.max(0,h.t-d*.4),Infinity)}};
const fm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function draw(){const b=$('#hls');b.innerHTML='';hl.forEach(h=>{const r=rng(h),e=document.createElement('div');e.className='hl';
  e.innerHTML=`<img src="${furl(h.thumb)}"><div><label><input type="checkbox" ${h.on?'checked':''}> #${h.n} · score ${h.score}</label><div>${fm(r.s)} · ${r.d}s</div><div class="note">Why: ${h.why}</div></div>`;
  e.querySelector('input').onchange=x=>h.on=x.target.checked;b.appendChild(e)})}
$('#dur').onchange=()=>hl.length&&draw();
$('#gen').onclick=async()=>{const sel=hl.filter(h=>h.on);if(!sel.length){$('#t2').textContent='Select a highlight.';return}lock(true);
  try{const clips=sel.map(h=>({n:h.n,dur:rng(h).d,start:h.t-rng(h).d*.4}));
   const res=await poll((await api('/render/'+id,{method:'POST',headers:{'Content-Type':'application/json','X-Token':$('#tok').value},body:JSON.stringify({clips,lang:$('#lang').value,res:+$('#res').value,enhance:$('#enh').checked})})).job,2);
   $('#clips').innerHTML=res.map(c=>`<div><video src="${furl(c.file)}" controls playsinline></video><div class="note">#${c.n} · ${c.dur}s${c.words?'':' · no speech detected'}</div><a class="b" href="${furl(c.file)}" download>Download</a></div>`).join('');$('#all').disabled=false;
  }catch(x){$('#t2').textContent='Failed: '+x.message}lock(false)};
$('#all').onclick=async()=>{for(const a of document.querySelectorAll('#clips a')){a.click();await sleep(700)}};
</script></body></html>
